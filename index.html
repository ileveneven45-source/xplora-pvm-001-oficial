<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xplora | Tuki</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b35;
      color: white;
      text-align: center;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .compass {
      font-size: 72px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 10px;
      letter-spacing: 3px;
      color: #d9ad45;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 420px;
    }

    button {
      margin-top: 25px;
      padding: 16px 28px;
      border: none;
      border-radius: 30px;
      background: #d9ad45;
      color: #071b35;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <script>
  const tukiYaTeConoce = localStorage.getItem("tuki_conocio");

  function guardarMemoria() {
    localStorage.setItem("tuki_conocio", "si");
  }
  </script><main>

    <div class="compass">🧭</div>

    <h1>XPLORA</h1>

    <p>Vive. Descubre. Conecta.</p>

    <h2>¡Hola! Soy Tuki 🦎</h2>

    <p>
      Acabas de encontrarme en Chignahuapan.
      ¿Quieres descubrir conmigo este lugar?
    </p>

    <button onclick="comenzar()">
  Vamos a descubrir
    </button>

  </main>

  <script>
    function comenzar() {

  if (tukiYaTeConoce === "si") {
    document.querySelector("main").innerHTML = `
      <div class="compass">🧭</div>

      <h2>¡Volviste!</h2>

      <p>
        Sabía que regresarías.
        Soy Tuki, ¿recuerdas?
      </p>

      <p>
        Esta vez tengo algo nuevo que enseñarte.
      </p>

      <button onclick="continuar()">
        Seguir descubriendo
      </button>
    `;
    return;
  }

  guardarMemoria();

  document.querySelector("main").innerHTML = `
        <div class="compass">🧭</div>

        <h2>¡Qué bueno que llegaste!</h2>

        <p>
          Chignahuapan tiene historias, personas
          y lugares que quiero enseñarte.
        </p>

        <p>
          Y tengo una pregunta para ti...
        </p>

        <button onclick="continuar()">
          Cuéntame
        </button>
      `;
    }
function continuar() {
  document.querySelector("main").innerHTML = `
    <div class="compass">🧭</div>

    <h2>Entonces ven conmigo...</h2>

    <p>
      Este es el Kiosco Mudéjar.
      Uno de los lugares que hacen especial a Chignahuapan.
    </p>

    <p>
      Pero aquí hay algo que quiero enseñarte...
    </p>

    <button onclick="siguiente()">
      Descubrir
    </button>
  `;
}

function siguiente() {
  document.querySelector("main").innerHTML = `
    <div class="compass">🧭</div>

    <h2>¿Ves aquella estatua?</h2>

    <p>
      Es Capulina, un personaje muy querido
      de Chignahuapan que hizo reír a México.
    </p>

    <p>
      Está muy cerca de aquí.
      ¿Vamos?
    </p>

    <button onclick="finalizar()">
      ¡Vamos!
    </button>
  `;
}

function finalizar() {
  document.querySelector("main").innerHTML = `
    <div class="compass">🧭</div>

    <h2>Esta aventura apenas comienza.</h2>

    <p>
      Soy Tuki, y quiero enseñarte
      los secretos de mi pueblo.
    </p>

    <p>
      Nos vemos en el próximo lugar.
    </p>
  `;
}
    
  </script>

</body>
</html>
