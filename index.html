<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xplora | Tuki</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b35;
      color: white;
      text-align: center;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .compass {
      font-size: 72px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 10px;
      letter-spacing: 3px;
      color: #d9ad45;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 420px;
    }

    button {
      margin-top: 25px;
      padding: 16px 28px;
      border: none;
      border-radius: 30px;
      background: #d9ad45;
      color: #071b35;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <script>
  const tukiYaTeConoce = localStorage.getItem("tuki_conocio");

  function guardarMemoria() {
    localStorage.setItem("tuki_conocio", "si");
  }
  </script><main>

    <div class="compass">🧭</div>

    <h1>XPLORA</h1>

    <p>Vive. Descubre. Conecta.</p>

    <h2>¡Hola! Soy Tuki 🦎</h2>

    <p>
      Acabas de encontrarme en Chignahuapan.
Y creo que este lugar tiene algo que contarte.
    </p>

    <button onclick="comenzar()">
  Descubrir con Tuki
    </button>

  </main>

  <script>
    function comenzar() {

  if (tukiYaTeConoce === "si") {
    document.querySelector("main").innerHTML = `
  <div class="compass">🧭</div>

  <h2>¡Ven! Ven conmigo…</h2>

  <p>
    Quiero enseñarte algo que me gusta mucho.
  </p>

  <p>
    Aunque… te voy a contar un secreto.
  </p>

  <p>
    Cuando hay mucha gente aquí, me gusta esconderme
    entre los detalles del kiosco y mirar quién se detiene
    a verlo de verdad.
  </p>

  <button onclick="continuar()">
    Vamos a mirarlo
  </button>
`;
    return;
  }

  guardarMemoria();

  document.querySelector("main").innerHTML = `
        <div class="compass">🧭</div>

        <h2>¡Qué bueno que llegaste!</h2>

        <p>
          Chignahuapan tiene historias, personas
          y lugares que quiero enseñarte.
        </p>

        <p>
          Y tengo una pregunta para ti...
        </p>

        <button onclick="continuar()">
          Cuéntame
        </button>
      `;
    }
function continuar() {
  document.querySelector("main").innerHTML = `
  <div class="compass">🧭</div>

  <h2>Eso… así.</h2>

  <p>
    Míralo con calma.
  </p>

  <p>
    Busca sus formas, sus colores y esos pequeños detalles
    que casi nadie mira.
  </p>

  <p>
    ¿Encontraste algo que te gustara?
  </p>

  <button onclick="siguiente()">
    Sí, encontré algo
  </button>
`;
}

function siguiente() {
  document.querySelector("main").innerHTML = `
  <div class="compass">🧭</div>

  <h2>¡Qué bueno! 😄</h2>

  <p>
    Ya empezaste a descubrirlo por ti mismo.
  </p>

  <p>
    Pero espera…
  </p>

  <p>
    Mi brújula acaba de señalar algo.
  </p>

  <div class="compass">🧭</div>

  <p>
    Hay alguien muy cerquita de aquí.
  </p>

  <p>
    ¿Quieres conocerlo?
  </p>

  <button onclick="finalizar()">
    ¿Quién?
  </button>
`;
}

function finalizar() {
  document.querySelector("main").innerHTML = `
    <div class="compass">🧭</div>

    <h2>¡Capulina! 😄</h2>

    <p>
      Sí… ¡Capulina!
    </p>

    <p>
      Uno de los personajes que hizo reír a México
      y que también forma parte de la historia de Chignahuapan.
    </p>

    <p>
      Está muy cerquita de aquí.
    </p>

    <p>
      ¿Vamos a conocerlo?
    </p>

    <button onclick="finAventura()">
      Vamos con Capulina →
    </button>
  `;
}
function finAventura() {
  document.querySelector("main").innerHTML = `
    <div class="compass">🧭</div>

    <h2>¡Vamos! 🧭</h2>

    <p>
      Capulina está muy cerquita de aquí.
    </p>

    <p>
      Sigue mi brújula y vamos a conocerlo.
    </p>

    <p>
      Cuando llegues, vuelve a buscarme.
    </p>

    <button onclick="location.reload()">
      Seguir descubriendo →
    </button>
  `;
      }
    
  </script>

</body>
</html>
